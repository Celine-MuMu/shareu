<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1424">
  <title>ShareU</title>

  <!-- 字體：Noto Sans TC（中文）＋ Outfit（Logo、數字） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 頂部導覽列（電腦版看得到全部連結，手機版只留 Logo 和語言切換） ===== -->
  <header class="topbar">
    <a href="#/" class="logo">ShareU</a>

    <nav class="topnav">
      <a href="#/" data-route="home"><span data-icon="home"></span><span data-i18n="nav_home"></span></a>
      <a href="#/browse" data-route="browse"><span data-icon="search"></span><span data-i18n="nav_browse"></span></a>
      <a href="#/new" data-route="new"><span data-icon="plus"></span><span data-i18n="nav_new"></span></a>
      <a href="#/me" data-route="me"><span data-icon="user"></span><span data-i18n="nav_me"></span></a>
      <a href="#/about" data-route="about"><span data-icon="info"></span><span data-i18n="nav_about"></span></a>
    </nav>

    <!-- 目前登入的人（沒登入顯示「登入」），點了可以切換身分 -->
    <a class="user-btn" id="userBtn" href="#/login"></a>

    <!-- 語言切換：按一下在「中」和「EN」之間切換 -->
    <button class="lang-btn" id="langBtn" type="button">
      <span data-icon="globe"></span><span id="langLabel"></span>
    </button>
  </header>

  <!-- ===== 內容區：app.js 會依照網址把對應的頁面畫在這裡 ===== -->
  <main id="app"></main>

  <!-- ===== 底部導覽列（只有手機版顯示） ===== -->
  <nav class="tabbar">
    <a href="#/" data-route="home"><span data-icon="home"></span><span data-i18n="nav_home"></span></a>
    <a href="#/browse" data-route="browse"><span data-icon="search"></span><span data-i18n="nav_browse"></span></a>
    <a href="#/new" data-route="new"><span data-icon="plus"></span><span data-i18n="nav_new"></span></a>
    <a href="#/me" data-route="me"><span data-icon="user"></span><span data-i18n="nav_me"></span></a>
    <a href="#/about" data-route="about"><span data-icon="info"></span><span data-i18n="nav_about"></span></a>
  </nav>

  <!-- 程式：順序很重要，後面的會用到前面的 -->
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="ui.js"></script>
  <script src="pages/home.js"></script>
  <script src="pages/browse.js"></script>
  <script src="pages/item.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/rent.js"></script>
  <script src="pages/list-item.js"></script>
  <script src="pages/me.js"></script>
  <script src="pages/about.js"></script>
  <script src="app.js"></script>
</body>
</html>
